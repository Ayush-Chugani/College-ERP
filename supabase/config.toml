# Supabase CLI configuration for local development (`supabase start`) and `supabase db push`.
# project_id is a local label; link the hosted project with `supabase link --project-ref <ref>`.
# Check major_version against the hosted project (Dashboard > Settings > Infrastructure) before relying on it.
project_id = "sims"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Add the production URL(s) here and in the dashboard (Authentication > URL Configuration).
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
